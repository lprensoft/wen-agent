name: Docker image

# 正式 tag 发布多架构镜像到 GHCR；手动触发推 dev，用来在发版前验证流水线。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 版本号
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: 核对 tag 与版本号
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          code_version=$(sed -n -E 's/^(const|var) Version = "(.*)"$/\2/p' internal/version/version.go)
          tag_version="${GITHUB_REF_NAME%%-*}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "::error::tag 与 internal/version/version.go 不一致（代码 $code_version，tag $tag_version）"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 测试
        run: |
          go vet ./...
          go test -count=1 ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # type=ref,event=tag 默认会自动生成 latest；关掉它，latest 只由下一行控制，
          # 否则 v1.0.0-rc1 这类预发布 tag 也会覆盖稳定版的 latest。
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
