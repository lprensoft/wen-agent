name: CI

# 每次推送 main 与 PR 都跑：vet、全量测试、语言包覆盖、gofmt 与生成物一致性。
# 正式发版仍由 release.yml 负责，这里只做质量门禁。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal tools)
          if [ -n "$out" ]; then
            echo "::error::以下文件未格式化，请在本机跑 gofmt 后提交："
            echo "$out"
            exit 1
          fi

      - name: 测试
        run: go test -count=1 ./...

      - name: 语言包覆盖
        run: go test ./cmd/wen -run 'TestLocaleCoverage|TestPromptCoverage' -count=1

      # 生成物随库提交，这里验证它们与当前版本号一致。Go 版本必须与 go.mod
      # 一致：PNG 编码器的输出随版本变化，换了版本会误报。
      - name: 生成物一致
        run: |
          go generate ./cmd/wen
          git diff --exit-code

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # GOTMPDIR 只给测试这一步：setup-go 会先跑 go env，目录还不存在时设置它
      # 会让那一步直接失败（Go 要求 GOTMPDIR 指向已存在的目录）。
      - name: 测试
        env:
          # 临时构建放进项目目录，避免 execcmd 的测试被杀软误杀（见 AGENTS.md）。
          GOTMPDIR: ${{ github.workspace }}\.gotmp
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GOTMPDIR" | Out-Null
          go test -count=1 ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "$RUNNER_TEMP/wen-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/wen

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 构建镜像
        run: docker build -t wen-agent:ci .

      - name: 冒烟测试
        run: |
          test "$(docker run --rm wen-agent:ci version)" = "$(sed -n -E 's/^(const|var) Version = "(.*)"$/\2/p' internal/version/version.go)"
          docker run --rm --entrypoint sh wen-agent:ci -c 'test "$(id -u)" = "10001" && test -f /usr/share/zoneinfo/Asia/Shanghai && test -f /etc/ssl/certs/ca-certificates.crt'
          docker run --rm wen-agent:ci help serve | grep -q -- '-host'
