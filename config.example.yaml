# Wen Agent 配置示例　·　English: config.example.en.yaml
# 复制为 config.yaml 后按需修改（config.yaml 已在 .gitignore 中，不会提交入库）。
# 每一项的详细说明见 docs/configuration.md，这里只说它是什么。

# 这个服务用哪门语言：zh / en。不填则跟随系统区域，判不出来时用中文。
# 它管发给模型的提示词与运行信息；浏览器界面的语言在设置页右上角另选。
# lang: zh

server:
  host: 127.0.0.1
  port: 8080
  # 回环免认证（默认开启）。前面套了 Nginx / Caddy 之类反向代理时**必须改成 false**：
  # 那种部署下所有请求都从回环地址进来，开着等于没有认证。
  # trust_loopback: true

# 访问口令不在这里配，它存于 <配置目录>/auth.json，由设置页的「访问控制」维护
# （容器与自动化部署可用环境变量 WEN_AUTH_PASSWORD）。未设口令时即便 host 配成
# 0.0.0.0 也会降级为只监听 127.0.0.1。

# 当前使用的模型。这里是初始值，设置页「模型」栏目的改动写入 models.json 并优先生效。
model:
  provider: deepseek
  name: deepseek-v4-flash
  temperature: 0.7           # 思考模式开启时不生效
  max_tokens: 4096
  thinking: high             # off / low / medium / high / xhigh / max
  context_length: 1000000    # 模型上下文窗口（token），超出时裁掉最旧的对话轮次

# Provider 注册表 —— 后续接入 OpenAI / Ollama 等只需在此加条目
# 不想手填的话，设置页的「新增提供商」里有一张预置列表（DeepSeek、智谱、Kimi、
# 通义千问、豆包、OpenAI、Anthropic、Ollama 等），挑一家就把地址与常用模型都填好了。
providers:
  deepseek:
    type: openai_compat      # openai_compat / anthropic
    base_url: https://api.deepseek.com
    api_key: sk-xxxxxxxx     # 直接填写，也支持 ${VAR} 从环境变量读取
  # anthropic:
  #   type: anthropic
  #   base_url: https://api.anthropic.com
  #   api_key: sk-ant-xxxxxxxx
  #   prompt_cache: true     # 提示词缓存（仅 anthropic，默认开启）。对话间隔常超过
  #                          # 几分钟时关掉更省，理由见 docs/configuration.md

agent:
  system_prompt: ""          # 系统提示词，先留空
  max_turns: 20              # 单次用户请求内工具循环上限
  workdir: ""                # 工作目录（插件与环境块共用），空 = 进程当前目录

# 插件的开关与配置不在这里配：它们由设置页维护，存于 <配置目录>/plugins.state.json，
# 插件自己的数据落在 <配置目录>/plugins/<插件名>/。开箱默认开着哪些见
# docs/plugins/README.md。

session:
  dir: ""                    # 会话存储目录，空 = <配置目录>/sessions
